---
name: PR

on:
  pull_request:
    branches:
      - main
  # release.yml opens its changelog pull request with GITHUB_TOKEN, and a pull
  # request opened with that token does not fire `pull_request` — GitHub
  # declines to let a workflow start another workflow. Without this the main
  # ruleset's four required checks would never report on it and it could never
  # be merged.
  #
  # A ruleset matches a check by name whatever workflow posted it, and these
  # are the same four jobs under the same four names, so running them on the
  # push satisfies the same gate. Scoped to the branch prefix release.yml uses,
  # so ordinary branches still get one run rather than two.
  push:
    branches:
      - "release/**"

defaults:
  run:
    shell: bash

# Only the head of a branch is worth checking. Pushing a fixup while the
# previous commit is still running abandons that run instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `lint:ci` is `lint` with oxlint's GitHub formatter, which annotates the
      # diff itself so a failure is readable where the change is rather than
      # only in the log.
      - run: pnpm lint:ci
      - run: pnpm fta

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines` states, and the version .nvmrc develops against.
        # A package this data-heavy is worth proving on both rather than
        # assuming the older one from a passing build on the newer.
        #
        # What each runtime can tell us differs, though: whether the tests pass
        # is a question about the runtime, and whether they cover enough of the
        # source is not. Only the .nvmrc version measures coverage.
        include:
          - node: "22"
            script: test
          - node: "24"
            script: test:coverage
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:check
      - run: pnpm build
      # What gets published is the tarball, not the working tree, and the two
      # differ in ways nothing else here would catch. It rides along with the
      # build rather than taking a runner of its own: `pnpm pack` runs the
      # build again anyway, and a job spends far longer installing than either
      # of these takes.
      - run: pnpm pack:check

  # A pull request that publishes a version and says nothing about itself.
  #
  # release.yml already refuses to publish with an empty `## Unreleased`
  # section, which is the right thing to refuse and the worst moment to find
  # out: the run is however long after the merge, and the person who could have
  # written the entry in one sentence has long since stopped thinking about it.
  # This asks the same question while the change is still in front of its
  # author, which is the only time the answer is cheap.
  #
  # The title decides whether it is asked, because these merge as squashes: the
  # title becomes the commit subject, and the commit subject is what
  # semantic-release reads. So a change that genuinely belongs in no release
  # notes is retitled rather than excused — `chore:`, `docs:`, `test:`, `ci:`
  # and `style:` publish nothing and are not asked for anything.
  #
  # Deliberately not added to the main ruleset's required checks by this pull
  # request. Those four say the code works, which is a different kind of claim
  # from this one, and whether an unwritten entry should block a merge or only
  # embarrass it is a decision for the settings page rather than for this file.
  changelog:
    name: Changelog
    # The `release/**` push above is release.yml's own changelog pull request,
    # which has no `pull_request` payload to read and is a `chore:` anyway.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh api` on the pull request's files, below.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the entry
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment rather than interpolated into the script.
          # A title is text anyone opening a pull request chooses, and `${{ }}`
          # pastes it in as shell source before bash ever sees it.
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # The types that release, read out of .releaserc.yaml rather than
          # repeated here, so this cannot quietly drift from what actually
          # publishes. A `!` makes any type breaking, and breaking is a major.
          types="$(awk '$1 == "-" && $2 == "type:" { print $3 }' .releaserc.yaml | paste -sd '|' -)"
          releasable="^(${types})(\([^)]+\))?!?:"
          breaking="^[a-z]+(\([^)]+\))?!:"

          if [[ ! "$TITLE" =~ $releasable && ! "$TITLE" =~ $breaking ]]; then
            echo "\"$TITLE\" publishes nothing, so there is nothing to write down."
            exit 0
          fi

          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" --paginate --jq '.[].filename')"

          if ! grep -qxF CHANGELOG.md <<<"$files"; then
            echo "::error::\"$TITLE\" publishes a version and does not touch CHANGELOG.md. Write the entry under '## Unreleased', or retitle to a type that releases nothing."
            exit 1
          fi

          # The same command release.yml runs, against the merged file, so what
          # passes here is what the release will find. Touching CHANGELOG.md is
          # not the same as having written anything under the heading the notes
          # are taken from.
          if ! ./scripts/sh/changelog.sh notes > /dev/null; then
            echo "::error::CHANGELOG.md changed, but '## Unreleased' is empty. That heading is where the release notes come from; an entry anywhere else is not read."
            exit 1
          fi
